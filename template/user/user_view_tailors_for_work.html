{% extends 'user/user_base.html' %}
{% block content %}

<style>
    .teams-gd {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: transform 0.2s ease-in-out;
        margin-bottom: 20px;
        text-align: center;
    }

    .teams-gd:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    .team-img img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-bottom: 1px solid #ddd;
    }

    .team-hover {
        padding: 15px;
        background: #f9f9f9;
        border-top: 1px solid #ddd;
    }

    .s-link {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 15px;
    }

    .btn-outline-primary, .btn-outline-info {
        border: 1px solid;
        padding: 8px 16px;
        border-radius: 5px;
        transition: background-color 0.2s ease, color 0.2s ease;
        flex: 1;
    }

    .btn-outline-primary {
        border-color: #007bff;
        color: #007bff;
        background: none;
    }

    .btn-outline-primary:hover {
        background-color: #007bff;
        color: #fff;
    }

    .btn-outline-info {
        border-color: #17a2b8;
        color: #17a2b8;
        background: none;
    }

    .btn-outline-info:hover {
        background-color: #17a2b8;
        color: #fff;
    }

    .team-title {
        background: #fff;
    }

    .team-title h5 {
        margin: 0;
        font-size: 1.1rem;
    }

    .team-title span {
        color: #888;
        font-size: 0.9rem;
    }
</style>

<section class="inner-banner py-5">
    <div class="w3l-breadcrumb py-lg-5">
        <div class="container pt-4 pb-sm-4">
            <h4 class="inner-text-title font-weight-bold pt-sm-5 pt-4">View stylists</h4>
            <ul class="breadcrumbs-custom-path">
                <li><a href="/user_home">Home</a></li>
                <li class="active"><i class="fas fa-angle-right mx-2"></i>View stylists</li>
            </ul>
        </div>
    </div>
</section>

<section class="w3l-team-61 py-5" id="team">
    <div class="container py-lg-5 py-md-4 py-2">
        <h3 class="title-style mb-lg-5 mb-4 text-center"><span>Choose</span> Tailor</h3>
        <div class="team-right-content row text-center justify-content-center">
            {% for t in tailors %}
            <div class="col-lg-3 col-sm-6 mt-sm-0 mt-4">
                <div class="teams-gd">
                    <div class="team-member">
                        <div class="team-img">
                            <a href="/user_view_outfit_designs?id={{t.id}}">
                                <img class="img-fluid img-responsive" src="../static/media/{{t.profile_picture}}" alt="{{s.name}}">
                            </a>
                        </div>
                        <div class="team-hover">
                            <div class="desk">
                                <h4><a href="/user_view_outfit_designs?id={{t.id}}">Meet Me</a></h4>
                                <p>Lorem ipsum dolor sit amet, Ea consequuntur.</p>
                            </div>
                        </div>
                    </div>
                    <div class="team-title p-4">
                        <h5><a href="/user_view_outfit_designs?id={{t.id}}">{{t.name}}</a></h5>
                        <span>Stylist</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

{% endblock %}
