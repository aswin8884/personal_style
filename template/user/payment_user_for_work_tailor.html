<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .payment-form {
            max-width: 500px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .card-icons img {
            width: 60px;
            margin: 0 10px;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="payment-form">
            <h2 class="text-center mb-4">Payment Information</h2>
            <form method="post" onsubmit="return validatePaymentForm()">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="cardName" class="form-label">Cardholder Name</label>
                    <input type="text" class="form-control" id="cardName" name="cardholder_name" placeholder="Enter cardholder's name" required minlength="3" pattern="^[A-Za-z\s]+$" title="Only letters and spaces are allowed">
                    <div id="cardNameError" class="error-message"></div>
                </div>
                <div class="mb-3">
                    <label for="cardNumber" class="form-label">Card Number</label>
                    <input type="text" class="form-control" id="cardNumber" name="card_number" placeholder="1234 5678 9012 3456" required pattern="^\d{4}\s?\d{4}\s?\d{4}\s?\d{4}$" title="Enter a valid 16-digit card number">
                    <div id="cardNumberError" class="error-message"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="expiryDate" class="form-label">Expiration Date</label>
                        <input type="text" class="form-control" id="expiryDate" name="expiry_date" placeholder="MM/YY" required pattern="^(0[1-9]|1[0-2])\/?([0-9]{2})$" title="Enter a valid expiration date in MM/YY format">
                        <div id="expiryDateError" class="error-message"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="cvv" class="form-label">CVV</label>
                        <input type="password" class="form-control" id="cvv" name="cvv" placeholder="123" required pattern="^\d{3,4}$" title="Enter a valid 3 or 4-digit CVV">
                        <div id="cvvError" class="error-message"></div>
                    </div>
                </div>
                <div class="mb-4 card-icons text-center">
                    <img src="https://via.placeholder.com/60x40?text=Visa" alt="Visa">
                    <img src="https://via.placeholder.com/60x40?text=Mastercard" alt="Mastercard">
                    <img src="https://via.placeholder.com/60x40?text=Amex" alt="American Express">
                </div>
                <button type="submit" class="btn btn-primary w-100">Pay Now</button>
            </form>
        </div>
    </div>

    <!-- Backend Validation Messages -->
    {% if messages %}
    {% for m in messages %}
    <script>alert("{{m}}")</script>
    {% endfor %}
    {% endif %}

    <script>
        function validatePaymentForm() {
            // Clear previous error messages
            document.getElementById("cardNameError").innerText = "";
            document.getElementById("cardNumberError").innerText = "";
            document.getElementById("expiryDateError").innerText = "";
            document.getElementById("cvvError").innerText = "";

            let isValid = true;

            // Cardholder Name Validation
            const cardName = document.getElementById("cardName").value.trim();
            const namePattern = /^[A-Za-z\s]{3,}$/;
            if (!namePattern.test(cardName)) {
                document.getElementById("cardNameError").innerText = "Name must be at least 3 letters and contain only letters and spaces.";
                isValid = false;
            }

            // Card Number Validation
            const cardNumber = document.getElementById("cardNumber").value.replace(/\s+/g, '');
            const cardNumberPattern = /^\d{16}$/;
            if (!cardNumberPattern.test(cardNumber)) {
                document.getElementById("cardNumberError").innerText = "Card number must be exactly 16 digits.";
                isValid = false;
            }

            // Expiration Date Validation
            const expiryDate = document.getElementById("expiryDate").value;
            const expiryPattern = /^(0[1-9]|1[0-2])\/?([0-9]{2})$/;
            if (!expiryPattern.test(expiryDate)) {
                document.getElementById("expiryDateError").innerText = "Expiration date must be in MM/YY format.";
                isValid = false;
            } else {
                // Check if the expiration date is in the future
                const parts = expiryDate.split('/');
                const month = parseInt(parts[0], 10);
                const year = parseInt(parts[1], 10) + 2000; // Assuming 20YY
                const today = new Date();
                const expiry = new Date(year, month);
                if (expiry < today) {
                    document.getElementById("expiryDateError").innerText = "The expiration date must be in the future.";
                    isValid = false;
                }
            }

            // CVV Validation
            const cvv = document.getElementById("cvv").value;
            const cvvPattern = /^\d{3,4}$/;
            if (!cvvPattern.test(cvv)) {
                document.getElementById("cvvError").innerText = "CVV must be 3 or 4 digits.";
                isValid = false;
            }

            if (!isValid) {
                // Optionally, focus the first invalid field
                const firstErrorField = document.querySelector('.error-message:not(:empty)');
                if (firstErrorField) {
                    firstErrorField.previousElementSibling.focus();
                }
            }

            return isValid;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
