{% extends 'user/user_base.html' %}
{% block content %}

<section class="inner-banner py-5">
    <div class="w3l-breadcrumb py-lg-5">
        <div class="container pt-4 pb-sm-4">
            <h4 class="inner-text-title font-weight-bold pt-sm-5 pt-4">View Outfits</h4>
            <ul class="breadcrumbs-custom-path">
                <li><a href="/user_home">Home</a></li>
                <li class="active"><i class="fas fa-angle-right mx-2"></i>View Outfits</li>
            </ul>
        </div>
    </div>
</section>

<div class="w3l-servicesblock2 py-5" id="services">
    <div class="container py-lg-5 py-md-4 py-2">
        <h3 class="title-style text-center mb-lg-5 mb-4">Outfits From<span> 
            <a href="/user_request_work_to_tailor?id={{stylist.id}}">{{stylist.name}}</a></span></h3>
        <div class="row">
            {% for o in outfit_designs %}
            <div class="col-lg-3 col-sm-6">
                <div class="grids5-info">
                    <a href="" class="blog-image d-block zoom"><img src="../static/media/{{o.image}}" alt=""
                            class="img-fluid radius-image" />
                        <div class="image-overlay">
                            <h4>{{o.name}}</h4>
                            <!-- <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Esse, consectetur.</p> -->
                        </div>
                        <div class="iconic-plus">
                            <i class="fas fa-plus"></i>
                        </div>
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
